<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cardápio RU - UFSM</title>
    <style>
        /* Estilos visuais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        #loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
        }
        
        /* Uso de CSS Grid para forçar 6 colunas na tela cheia */
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
        }
        .day-title {
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 10px;
            text-transform: capitalize;
        }
        .meal-title {
            color: #e67e22;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1em;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            font-size: 0.85em;
            padding: 5px 0;
            border-bottom: 1px solid #ecf0f1;
        }
        li:last-child {
            border-bottom: none;
        }
        .error { color: #e74c3c; font-weight: bold; }

        /* Regras de responsividade para telas menores (notebooks e celulares) */
        @media (max-width: 1400px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>Cardápio RU UFSM (Semana Atual)</h1>
    <div id="loading">Buscando cardápios nos servidores da UFSM...</div>
    <div class="container" id="menu-container"></div>

    <script>
        async function loadMenus() {
            const container = document.getElementById('menu-container');
            const loading = document.getElementById('loading');

            const now = new Date();
            const firstDay = new Date(now.setDate(now.getDate() - now.getDay())); 
            firstDay.setHours(0, 0, 0, 0);
            
            const lastDay = new Date(firstDay);
            lastDay.setDate(lastDay.getDate() + 6); 
            lastDay.setHours(23, 59, 59, 999);

            const inicio = Math.floor(firstDay.getTime() / 1000);
            const fim = Math.floor(lastDay.getTime() / 1000);

            const url41 = `https://portal.ufsm.br/ru/publico/buscarCardapio.json?inicio=${inicio}&fim=${fim}&idRestaurante=41&tiposRefeicao%5B%5D=1&tiposRefeicao%5B%5D=2&tiposRefeicao%5B%5D=3`;
            const url1 = `https://portal.ufsm.br/ru/publico/buscarCardapio.json?inicio=${inicio}&fim=${fim}&idRestaurante=1&tiposRefeicao%5B%5D=1&tiposRefeicao%5B%5D=2&tiposRefeicao%5B%5D=3`;

            try {
                // Requisição direta, sem proxy
                const [res41, res1] = await Promise.all([
                    fetch(url41),
                    fetch(url1)
                ]);

                const data41 = await res41.json();
                const data1 = await res1.json();

                const almocoItems = data41.filter(item => item.title === "Almoço");
                const jantarItems = data1.filter(item => item.title === "Jantar");

                const menusByDay = {};

                const processMeal = (mealList, tipo) => {
                    mealList.forEach(item => {
                        const dateObj = new Date(item.start);
                        
                        // Cria uma chave YYYY-MM-DD para garantir a ordenação cronológica
                        const yyyy = dateObj.getFullYear();
                        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const dd = String(dateObj.getDate()).padStart(2, '0');
                        const sortKey = `${yyyy}-${mm}-${dd}`;

                        const dayName = dateObj.toLocaleDateString('pt-BR', { weekday: 'long' });
                        const dateString = dateObj.toLocaleDateString('pt-BR');

                        if (!menusByDay[sortKey]) {
                            menusByDay[sortKey] = { 
                                almoco: [], 
                                jantar: [],
                                displayTitle: `${dayName} (${dateString})`
                            };
                        }

                        const pratos = item.object.preparos.map(p => p.nomePreparo);
                        menusByDay[sortKey][tipo] = pratos;
                    });
                };

                processMeal(almocoItems, 'almoco');
                processMeal(jantarItems, 'jantar');

                loading.style.display = 'none';

                // Pega as chaves (datas), ordena cronologicamente e renderiza
                const sortedDates = Object.keys(menusByDay).sort();

                for (const date of sortedDates) {
                    const meals = menusByDay[date];
                    
                    if (meals.almoco.length === 0 && meals.jantar.length === 0) continue;

                    const card = document.createElement('div');
                    card.className = 'card';

                    let html = `<div class="day-title">${meals.displayTitle}</div>`;

                    if (meals.almoco.length > 0) {
                        html += `<div class="meal-title">☀️ Almoço (RU II)</div><ul>`;
                        meals.almoco.forEach(prato => html += `<li>${prato}</li>`);
                        html += `</ul>`;
                    }

                    if (meals.jantar.length > 0) {
                        html += `<div class="meal-title">🌙 Jantar (RU I)</div><ul>`;
                        meals.jantar.forEach(prato => html += `<li>${prato}</li>`);
                        html += `</ul>`;
                    }

                    card.innerHTML = html;
                    container.appendChild(card);
                }

            } catch (error) {
                loading.innerHTML = `<span class="error">Erro ao carregar o cardápio. Detalhes no console.</span>`;
                console.error("Detalhes do erro:", error);
            }
        }

        loadMenus();
    </script>
</body>
</html>
