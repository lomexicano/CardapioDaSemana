<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio da semana do RU - UFSM</title>
    <style>
        /* Variáveis de cores para o Tema Escuro (Padrão) */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0,0,0,0.5);
            --border-color: #333;
            --day-border: #3498db;
            --meal-title-color: #f39c12;
            --btn-bg: #333;
            --btn-color: #e0e0e0;
        }

        /* Variáveis de cores para o Tema Claro */
        body.light-mode {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: white;
            --card-shadow: rgba(0,0,0,0.1);
            --border-color: #ecf0f1;
            --day-border: #3498db;
            --meal-title-color: #e67e22;
            --btn-bg: #ddd;
            --btn-color: #333;
        }

        /* Estilos visuais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px; 
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Botão de Tema */
        #theme-toggle {
            position: absolute;
            top: 5px;
            right: 15px;
            background: var(--btn-bg);
            color: var(--btn-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.3s;
        }

        /* Título Principal Compacto */
        h1 {
            text-align: center;
            font-size: 1.0em; 
            margin-top: 2px;  
            margin-bottom: 5px; 
        }

        #loading {
            text-align: center;
            font-size: 1em;
            color: #7f8c8d;
        }
        
        /* 6 colunas */
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-top: 5px; 
            width: 100%;
            box-sizing: border-box;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 8px var(--card-shadow);
            padding: 10px 15px; 
            box-sizing: border-box;
            transition: background-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Divide o espaço restante do card exatamente em duas metades (50% almoço, 50% jantar) */
        .meals-wrapper {
            display: grid;
            grid-template-rows: 1fr 1fr;
            flex-grow: 1;
            gap: 10px;
        }

        .meal-section {
            display: flex;
            flex-direction: column;
        }

        /* Dias da semana com fonte reduzida */
        .day-title {
            font-weight: bold;
            font-size: 0.55em; 
            text-align: center;
            border-bottom: 2px solid var(--day-border);
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-transform: uppercase; 
        }

        /* Títulos das Refeições centralizados */
        .meal-title {
            color: var(--meal-title-color);
            font-weight: bold;
            margin-top: 4px;
            font-size: 0.9em;
            text-align: center; 
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            font-size: 0.75em;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
        }
        li:last-child {
            border-bottom: none;
        }
        .error { color: #e74c3c; font-weight: bold; }

        .current-day {
            background-color: #2a2a2a;
            border: 2px solid var(--meal-title-color);
        }
        body.light-mode .current-day {
            background-color: #fff3cd;
        }
        
        /* Responsividade */
        @media (max-width: 1400px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            #theme-toggle {
                position: static; 
                display: block;
                margin: 0 auto 10px auto;
            }
            /* No celular, desabilita a divisão 50/50 para não gerar espaços vazios gigantes */
            .meals-wrapper {
                grid-template-rows: auto auto; 
            }
        }
    </style>
</head>
<body>

    <button id="theme-toggle">☀️ Modo Claro</button>
    <h1>Cardápio do RU da UFSM (semana atual, almoço no I e jantar no II)</h1>
    <div id="loading">Buscando cardápios nos servidores da UFSM...</div>
    <div class="container" id="menu-container"></div>

    <script>
        // Lógica de alternância do tema
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeBtn.textContent = '🌙 Modo Escuro';
            } else {
                themeBtn.textContent = '☀️ Modo Claro';
            }
        });

        async function loadMenus() {
            const container = document.getElementById('menu-container');
            const loading = document.getElementById('loading');

            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            
            const firstDay = new Date(now.setDate(now.getDate() - now.getDay())); 
            firstDay.setHours(0, 0, 0, 0);
            
            const lastDay = new Date(firstDay);
            lastDay.setDate(lastDay.getDate() + 6); 
            lastDay.setHours(23, 59, 59, 999);

            const inicio = Math.floor(firstDay.getTime() / 1000);
            const fim = Math.floor(lastDay.getTime() / 1000);

            const url41 = `https://portal.ufsm.br/ru/publico/buscarCardapio.json?inicio=${inicio}&fim=${fim}&idRestaurante=41&tiposRefeicao%5B%5D=1&tiposRefeicao%5B%5D=2&tiposRefeicao%5B%5D=3`;
            const url1 = `https://portal.ufsm.br/ru/publico/buscarCardapio.json?inicio=${inicio}&fim=${fim}&idRestaurante=1&tiposRefeicao%5B%5D=1&tiposRefeicao%5B%5D=2&tiposRefeicao%5B%5D=3`;

            try {
                const [res41, res1] = await Promise.all([
                    fetch(url41),
                    fetch(url1)
                ]);

                const data41 = await res41.json();
                const data1 = await res1.json();

                const almocoItems = data41.filter(item => item.title === "Almoço");
                const jantarItems = data1.filter(item => item.title === "Jantar");

                const menusByDay = {};

                const processMeal = (mealList, tipo) => {
                    mealList.forEach(item => {
                        const dateObj = new Date(item.start);
                        
                        const yyyy = dateObj.getFullYear();
                        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const dd = String(dateObj.getDate()).padStart(2, '0');
                        const sortKey = `${yyyy}-${mm}-${dd}`;

                        const dayName = dateObj.toLocaleDateString('pt-BR', { weekday: 'long' });
                        const dateString = dateObj.toLocaleDateString('pt-BR');

                        if (!menusByDay[sortKey]) {
                            menusByDay[sortKey] = { 
                                almoco: [], 
                                jantar: [],
                                displayTitle: `${dayName} (${dateString})`
                            };
                        }

                        // Remove os temperos e aplica negrito se for de origem animal
                        const pratos = item.object.preparos
                            .filter(p => !p.nomePreparo.toUpperCase().startsWith('TEMPEROS'))
                            .map(p => p.isOrigemAnimal ? `<strong>${p.nomePreparo}</strong>` : p.nomePreparo);
                        
                        menusByDay[sortKey][tipo] = pratos;
                    });
                };

                processMeal(almocoItems, 'almoco');
                processMeal(jantarItems, 'jantar');

                loading.style.display = 'none';

                const sortedDates = Object.keys(menusByDay).sort();

                for (const date of sortedDates) {
                    const meals = menusByDay[date];
                    
                    if (meals.almoco.length === 0 && meals.jantar.length === 0) continue;

                    const card = document.createElement('div');
                    if (date === todayStr) {
                        card.className = 'card current-day';
                    } else {
                        card.className = 'card';
                    }

                    let html = `<div class="day-title">${meals.displayTitle}</div>`;

                    // Envelopa as duas refeições para forçar 50% do espaço para cada
                    html += `<div class="meals-wrapper">`;
                    
                    // --- Seção Almoço ---
                    html += `<div class="meal-section">`;
                    if (meals.almoco.length > 0) {
                        html += `<div class="meal-title">☀️ Almoço (RU II)</div><ul>`;
                        meals.almoco.forEach(prato => html += `<li>${prato}</li>`);
                        html += `</ul>`;
                    } else {
                        // Mantém a estrutura caso não haja almoço no dia, para não quebrar o layout
                        html += `<div class="meal-title" style="color: #7f8c8d;">☀️ Almoço (sem serviço)</div>`;
                    }
                    html += `</div>`;
                    
                    // --- Seção Jantar ---
                    html += `<div class="meal-section">`;
                    if (meals.jantar.length > 0) {
                        html += `<div class="meal-title">🌙 Jantar (RU I)</div><ul>`;
                        meals.jantar.forEach(prato => html += `<li>${prato}</li>`);
                        html += `</ul>`;
                    } else {
                        html += `<div class="meal-title" style="color: #7f8c8d;">🌙 Jantar (sem serviço)</div>`;
                    }
                    html += `</div>`;

                    html += `</div>`; // Fim meals-wrapper

                    card.innerHTML = html;
                    container.appendChild(card);
                }

            } catch (error) {
                loading.innerHTML = `<span class="error">Erro ao carregar o cardápio. Detalhes no console.</span>`;
                console.error("Detalhes do erro:", error);
            }
        }

        loadMenus();
    </script>
</body>
</html>
