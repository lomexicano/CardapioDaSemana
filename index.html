<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cardápio RU - UFSM</title>
    
    <!-- Ícone SVG -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <style>
        /* Variáveis de cores para o Tema Escuro (Padrão) */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0,0,0,0.5);
            --border-color: #333;
            --day-border: #3498db;
            --meal-title-color: #f39c12;
            --btn-bg: #333;
            --btn-color: #e0e0e0;
        }

        /* Variáveis de cores para o Tema Claro */
        body.light-mode {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: white;
            --card-shadow: rgba(0,0,0,0.1);
            --border-color: #ecf0f1;
            --day-border: #3498db;
            --meal-title-color: #e67e22;
            --btn-bg: #ddd;
            --btn-color: #333;
        }

        /* Estilos visuais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px; 
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Barra Superior - Flexbox garante o alinhamento na mesma linha */
        .top-bar {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center; /* Alinha todos os itens verticalmente ao centro */
            padding-top: 5px; 
            margin-bottom: 5px;
        }

        /* Seletores de RU */
        .ru-selectors {
            display: flex;
            gap: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .ru-selectors select {
            background: var(--btn-bg);
            color: var(--btn-color);
            border: none;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Botão de Tema */
        #theme-toggle {
            background: var(--btn-bg);
            color: var(--btn-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.3s;
        }

        /* Título Principal Ajustado para ficar na barra superior */
        h1 {
            position: absolute;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1.0em;
            margin-top: 2px;
            pointer-events: none; /* Garante que a "caixa" do título não bloqueie o clique nos botões laterais */
        }

        #loading {
            text-align: center;
            font-size: 1em;
            color: #7f8c8d;
        }
        
        /* 6 colunas */
        .container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-top: 5px; 
            width: 100%;
            box-sizing: border-box;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 8px var(--card-shadow);
            padding: 10px 15px; 
            box-sizing: border-box;
            transition: background-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .current-day {
            background-color: #2a2a2a;
            border: 2px solid var(--meal-title-color);
        }
        body.light-mode .current-day {
            background-color: #fff3cd;
        }

        /* Divide o espaço restante do card exatamente em duas metades */
        .meals-wrapper {
            display: grid;
            grid-template-rows: 1fr 1fr;
            flex-grow: 1;
            gap: 10px;
        }

        .meal-section {
            display: flex;
            flex-direction: column;
        }

        /* Dias da semana */
        .day-title {
            font-weight: bold;
            font-size: 0.55em; 
            text-align: center;
            border-bottom: 2px solid var(--day-border);
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-transform: uppercase; 
        }

        /* Títulos das Refeições Ajustados */
        .meal-title {
            color: var(--meal-title-color);
            font-weight: bold;
            margin-top: 4px;
            font-size: 0.9em;
            text-align: center; 
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        
        /* Tamanho de fonte reduzido para os itens da lista */
        li {
            font-size: 0.75em;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
        }
        li:last-child {
            border-bottom: none;
        }
        .error { color: #e74c3c; font-weight: bold; }

        /* Responsividade */
        @media (max-width: 1400px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .top-bar {
                flex-direction: column; /* Empilha os itens no celular */
                gap: 10px;
                padding-top: 10px;
            }
            .meals-wrapper {
                grid-template-rows: auto auto; 
            }
            h1 {
                position: static;
            }
        }
    </style>
</head>
<body>

    <!-- Os três elementos agora estão agrupados na mesma barra superior -->
    <div class="top-bar">
        <div class="ru-selectors">
            <label>Almoço:
                <select id="select-almoco">
                    <option value="1">RU I</option>
                    <option value="41" selected>RU II</option>
                </select>
            </label>
            <label>Jantar:
                <select id="select-jantar">
                    <option value="1" selected>RU I</option>
                    <option value="41">RU II</option>
                </select>
            </label>
        </div>
        
        <h1 id="main-title">Cardápio do RU da UFSM</h1>
        
        <button id="theme-toggle">☀️ Modo Claro</button>
    </div>
    
    <div id="loading">Buscando cardápios nos servidores da UFSM...</div>
    <div class="container" id="menu-container"></div>

    <script>
        // --- 1. CONFIGURAÇÕES DE TEMA ---
        const themeBtn = document.getElementById('theme-toggle');
        
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeBtn.textContent = '🌙 Modo Escuro';
        }

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeBtn.textContent = '🌙 Modo Escuro';
                localStorage.setItem('theme', 'light');
            } else {
                themeBtn.textContent = '☀️ Modo Claro';
                localStorage.setItem('theme', 'dark');
            }
        });

        // --- 2. CONFIGURAÇÕES DOS SELETORES DE RU ---
        const selectAlmoco = document.getElementById('select-almoco');
        const selectJantar = document.getElementById('select-jantar');
        const mainTitle = document.getElementById('main-title');

        if (localStorage.getItem('ruAlmoco')) selectAlmoco.value = localStorage.getItem('ruAlmoco');
        if (localStorage.getItem('ruJantar')) selectJantar.value = localStorage.getItem('ruJantar');

        // Lógica atualizada do Título Dinâmico
        function updateTitle() {
            const getRoman = (val) => val === '1' ? 'I' : 'II';
            const ruAlmocoStr = getRoman(selectAlmoco.value);
            const ruJantarStr = getRoman(selectJantar.value);

            if (ruAlmocoStr === ruJantarStr) {
                mainTitle.textContent = `Cardápio do RU da UFSM (semana atual, almoço e janta no RU ${ruAlmocoStr})`;
            } else {
                mainTitle.textContent = `Cardápio do RU da UFSM (semana atual, almoço no RU ${ruAlmocoStr} e jantar no RU ${ruJantarStr})`;
            }
        }
        
        updateTitle();

        selectAlmoco.addEventListener('change', () => {
            localStorage.setItem('ruAlmoco', selectAlmoco.value);
            updateTitle();
            loadMenus();
        });

        selectJantar.addEventListener('change', () => {
            localStorage.setItem('ruJantar', selectJantar.value);
            updateTitle();
            loadMenus();
        });


        // --- 3. LÓGICA DE BUSCA DO CARDÁPIO ---
        async function loadMenus() {
            const container = document.getElementById('menu-container');
            const loading = document.getElementById('loading');

            container.innerHTML = '';
            loading.style.display = 'block';

            const now = new Date();
            const firstDay = new Date(now.setDate(now.getDate() - now.getDay())); 
            firstDay.setHours(0, 0, 0, 0);
            
            const lastDay = new Date(firstDay);
            lastDay.setDate(lastDay.getDate() + 6); 
            lastDay.setHours(23, 59, 59, 999);

            const todayNow = new Date();
            const todayStr = `${todayNow.getFullYear()}-${String(todayNow.getMonth() + 1).padStart(2, '0')}-${String(todayNow.getDate()).padStart(2, '0')}`;

            const inicio = Math.floor(firstDay.getTime() / 1000);
            const fim = Math.floor(lastDay.getTime() / 1000);

            const idA = selectAlmoco.value;
            const idJ = selectJantar.value;

            const urlA = `https://portal.ufsm.br/ru/publico/buscarCardapio.json?inicio=${inicio}&fim=${fim}&idRestaurante=${idA}&tiposRefeicao%5B%5D=1&tiposRefeicao%5B%5D=2&tiposRefeicao%5B%5D=3`;
            const urlJ = `https://portal.ufsm.br/ru/publico/buscarCardapio.json?inicio=${inicio}&fim=${fim}&idRestaurante=${idJ}&tiposRefeicao%5B%5D=1&tiposRefeicao%5B%5D=2&tiposRefeicao%5B%5D=3`;

            try {
                let dataA, dataJ;

                if (idA === idJ) {
                    const res = await fetch(urlA);
                    const data = await res.json();
                    dataA = data;
                    dataJ = data;
                } else {
                    const [resA, resJ] = await Promise.all([ fetch(urlA), fetch(urlJ) ]);
                    dataA = await resA.json();
                    dataJ = await resJ.json();
                }

                const almocoItems = dataA.filter(item => item.title === "Almoço");
                const jantarItems = dataJ.filter(item => item.title === "Jantar");

                const menusByDay = {};

                const processMeal = (mealList, tipo) => {
                    mealList.forEach(item => {
                        const dateObj = new Date(item.start);
                        
                        const yyyy = dateObj.getFullYear();
                        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const dd = String(dateObj.getDate()).padStart(2, '0');
                        const sortKey = `${yyyy}-${mm}-${dd}`;

                        const dayName = dateObj.toLocaleDateString('pt-BR', { weekday: 'long' });
                        const dateString = dateObj.toLocaleDateString('pt-BR');

                        if (!menusByDay[sortKey]) {
                            menusByDay[sortKey] = { 
                                almoco: [], 
                                jantar: [],
                                displayTitle: `${dayName} (${dateString})`
                            };
                        }

                        const pratos = item.object.preparos
                            .filter(p => !p.nomePreparo.toUpperCase().startsWith('TEMPEROS'))
                            .map(p => p.isOrigemAnimal ? `<strong>${p.nomePreparo}</strong>` : p.nomePreparo);
                        
                        menusByDay[sortKey][tipo] = pratos;
                    });
                };

                processMeal(almocoItems, 'almoco');
                processMeal(jantarItems, 'jantar');

                loading.style.display = 'none';

                const sortedDates = Object.keys(menusByDay).sort();

                for (const date of sortedDates) {
                    const meals = menusByDay[date];
                    
                    if (meals.almoco.length === 0 && meals.jantar.length === 0) continue;

                    const card = document.createElement('div');
                    card.className = date === todayStr ? 'card current-day' : 'card';

                    let html = `<div class="day-title">${meals.displayTitle}</div>`;
                    html += `<div class="meals-wrapper">`;
                    
                    const nameA = idA === '1' ? 'RU I' : 'RU II';
                    const nameJ = idJ === '1' ? 'RU I' : 'RU II';

                    // --- Seção Almoço ---
                    html += `<div class="meal-section">`;
                    if (meals.almoco.length > 0) {
                        html += `<div class="meal-title">☀️ Almoço (${nameA})</div><ul>`;
                        meals.almoco.forEach(prato => html += `<li>${prato}</li>`);
                        html += `</ul>`;
                    } else {
                        html += `<div class="meal-title" style="color: #7f8c8d;">☀️ Almoço (sem serviço)</div>`;
                    }
                    html += `</div>`;
                    
                    // --- Seção Jantar ---
                    html += `<div class="meal-section">`;
                    if (meals.jantar.length > 0) {
                        html += `<div class="meal-title">🌙 Jantar (${nameJ})</div><ul>`;
                        meals.jantar.forEach(prato => html += `<li>${prato}</li>`);
                        html += `</ul>`;
                    } else {
                        html += `<div class="meal-title" style="color: #7f8c8d;">🌙 Jantar (sem serviço)</div>`;
                    }
                    html += `</div>`;

                    html += `</div>`; 

                    card.innerHTML = html;
                    container.appendChild(card);
                }
                // Scroll automático para o dia atual no Mobile
                if (window.innerWidth <= 768) {
                    const cardHoje = document.querySelector('.current-day');
                    if (cardHoje) {
                        // Um pequeno atraso (100ms) garante que a página já desenhou os cards antes de rolar
                        setTimeout(() => {
                            cardHoje.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 100);
                    }
                }

            } catch (error) {
                loading.innerHTML = `<span class="error">Erro ao carregar o cardápio. Detalhes no console.</span>`;
                console.error("Detalhes do erro:", error);
            }
        }

        loadMenus();
    </script>
</body>
</html>
